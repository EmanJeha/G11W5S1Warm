<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Mystery Topic Detectives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single game stage — scoreboard strip on top, one round card centred, controls at the bottom. Bright, single light look by design. */
:root{
  color-scheme: light;
  --bg:#EEF6FF;          /* ice-blue ground */
  --card:#FFFFFF;
  --ink:#0B1B3F;         /* deep navy text */
  --muted:#51607E;
  --line:#D5E2F3;
  --coral:#FF4D6D;       /* bug / wrong */
  --lemon:#FFC93C;       /* highlight */
  --mint:#05C793;        /* correct */
  --sky:#1E7BFF;         /* primary accent */
  --grape:#7A5CFF;       /* higher-order tag */
  --code:#F5F9FF;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"DM Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", "Consolas", ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:18px 28px;display:flex;flex-direction:column;gap:16px;min-height:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:12px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand svg{width:34px;height:34px}
.scores{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.team{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;min-width:0;transition:transform .25s}
.team .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.team .pt{font-family:var(--display);font-weight:800;font-size:22px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums;border-radius:999px;padding:2px 10px;color:#fff}
.team.bump{transform:scale(1.08)}
.t0 .pt{background:var(--coral)} .t1 .pt{background:var(--sky)} .t2 .pt{background:var(--mint)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

/* progress */
.prog{display:flex;gap:6px}
.prog i{flex:1;height:8px;border-radius:99px;background:var(--line);transition:background .3s}
.prog i.done{background:var(--sky)} .prog i.now{background:var(--lemon)}

/* stage card */
.stage{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:26px clamp(18px,3vw,36px);box-shadow:0 18px 40px -24px rgba(11,27,63,.35);display:flex;flex-direction:column;gap:18px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:.6}to{transform:none;opacity:1}}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
.tag.round{background:var(--ink);color:#fff}
.tag.bloom{background:#EDE8FF;color:var(--grape)}
.tag.kind{background:#E3F0FF;color:var(--sky)}
.timer{margin-left:auto;display:flex;align-items:center;gap:10px}
.ring{width:58px;height:58px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.ring.low b{color:var(--coral)}
h1.q{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.1vw,38px);line-height:1.12;letter-spacing:-.015em;text-wrap:balance;margin:0}
.scenario{color:var(--muted);font-size:18px;margin:-6px 0 0;max-width:70ch}
.body{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.body.solo{grid-template-columns:minmax(0,1fr)}

/* code panel */
.code{background:var(--code);border:2px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}
.code .bar{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:2px solid var(--line);font-family:var(--mono);font-size:13px;color:var(--muted)}
.code .bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
.code pre{margin:0;padding:12px 0;overflow-x:auto;font-family:var(--mono);font-size:clamp(14px,1.45vw,18px);line-height:1.75}
.ln{display:flex;gap:14px;padding:0 16px;border-left:5px solid transparent;transition:background .2s,border-color .2s}
.ln .n{color:#9AA9C2;user-select:none;min-width:1.4em;text-align:right}
.ln.click{cursor:pointer}
.ln.click:hover{background:#FFF6D9}
.ln.pick{background:#FFF0C2;border-left-color:var(--lemon)}
.ln.right{background:#DDFBF1;border-left-color:var(--mint)}
.ln.wrong{background:#FFE3E9;border-left-color:var(--coral)}
.k{color:#7A3FF2}.s{color:#0B8A5A}.f{color:#0B63D6}.d{color:#D2541B}.c{color:#8A97AD;font-style:italic}

/* options */
.opts{display:grid;gap:12px;min-width:0}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:clamp(16px,1.5vw,19px);font-weight:500;transition:transform .15s,border-color .2s,background .2s;min-width:0}
.opt:hover{transform:translateY(-2px);border-color:var(--sky)}
.opt .L{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;color:#fff}
.opt:nth-child(1) .L{background:var(--coral)} .opt:nth-child(2) .L{background:var(--sky)} .opt:nth-child(3) .L{background:var(--lemon);color:var(--ink)} .opt:nth-child(4) .L{background:var(--mint)}
.opt .tx{min-width:0}
.opt code{font-family:var(--mono);font-size:.92em;background:var(--code);padding:1px 6px;border-radius:6px}
.opt.pick{border-color:var(--lemon);background:#FFF8E1}
.opt.right{border-color:var(--mint);background:#E2FBF2;animation:yes .5s}
.opt.wrong{opacity:.5}
@keyframes yes{30%{transform:scale(1.04)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* think + reveal */
.think{display:flex;gap:12px;align-items:flex-start;background:#F3EFFF;border-radius:18px;padding:14px 16px;color:#3A2A8C}
.think svg{flex:none;width:26px;height:26px;margin-top:1px}
.think b{font-family:var(--display)}
.reveal{display:flex;gap:12px;align-items:flex-start;background:#E2FBF2;border:2px solid #9CEBD2;border-radius:18px;padding:14px 16px}
.reveal svg{flex:none;width:28px;height:28px}
.reveal p{margin:0}
.reveal code{font-family:var(--mono);background:#fff;padding:1px 6px;border-radius:6px}

/* award */
.award{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.award span{font-weight:700;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.give{border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;background:var(--card);transition:transform .15s}
.give:hover{transform:translateY(-2px)}
.give.t0{border-color:#FFB3C1}.give.t1{border-color:#A9CBFF}.give.t2{border-color:#9CEBD2}

/* controls */
.ctrl{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{border-radius:16px;padding:14px 22px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;gap:10px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn.main{background:var(--sky);color:#fff;box-shadow:0 8px 0 #1259C2}
.btn.main:active{transform:translateY(4px);box-shadow:0 4px 0 #1259C2}
.btn.alt{background:var(--lemon);color:var(--ink);box-shadow:0 8px 0 #D9A51E}
.btn.alt:active{transform:translateY(4px);box-shadow:0 4px 0 #D9A51E}
.btn.ghost{background:var(--card);border:2px solid var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.hint{color:var(--muted);font-size:14px}
kbd{font-family:var(--mono);font-size:12px;background:var(--card);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 6px}

/* start + end screens */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,6vw,76px);line-height:.95;letter-spacing:-.03em;margin:8px 0 14px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--coral);position:relative}
.hero p{font-size:19px;color:var(--muted);max-width:52ch;margin:0}
.case{background:var(--code);border:2px dashed #B9CCE6;border-radius:22px;padding:18px;display:grid;gap:12px}
.case h3{margin:0;font-family:var(--display);font-size:20px}
.case label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.case input{width:100%;font:inherit;font-size:18px;font-weight:700;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rule{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
.rule b{display:block;font-family:var(--display);font-size:18px;margin-bottom:2px}
.rule small{color:var(--muted);font-size:15px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;padding-top:10px;flex-wrap:wrap}
.pod{width:min(200px,28vw);text-align:center}
.pod .blk{border-radius:18px 18px 8px 8px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:40px;animation:rise .8s cubic-bezier(.2,1.3,.4,1) both}
.pod .who{font-weight:700;margin-bottom:6px}
.pod .sc{font-family:var(--display);font-size:22px;font-weight:800}
@keyframes rise{from{transform:scaleY(.2);transform-origin:bottom}to{transform:none}}
.bridge{background:#FFF8E1;border:2px solid #FFE08A;border-radius:18px;padding:16px 18px;font-size:18px}

@media (max-width:820px){
  .body,.hero{grid-template-columns:minmax(0,1fr)}
  .rules{grid-template-columns:minmax(0,1fr)}
  .scores{margin-left:0;width:100%}
  .team .nm{max-width:90px}
  .timer{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* mystery word board */
.board{display:flex;gap:clamp(4px,1vw,10px);justify-content:center;flex-wrap:wrap}
.tile{width:clamp(34px,6.4vw,68px);height:clamp(44px,8vw,84px);border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(22px,4.4vw,48px);perspective:400px;box-shadow:0 6px 0 #061029}
.tile.q{background:#DCE7F7;color:#9AAED0;box-shadow:0 6px 0 #BFD0EA}
.tile.new{animation:flip .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes flip{0%{transform:rotateX(90deg) scale(.8)}100%{transform:none}}
.tile.c0{background:var(--coral);box-shadow:0 6px 0 #C4304D}.tile.c1{background:var(--sky);box-shadow:0 6px 0 #1259C2}.tile.c2{background:var(--mint);box-shadow:0 6px 0 #03976F}.tile.c3{background:var(--grape);box-shadow:0 6px 0 #5639D6}.tile.c4{background:var(--lemon);color:var(--ink);box-shadow:0 6px 0 #D9A51E}
.boardwrap{display:grid;gap:10px;justify-items:center;background:var(--code);border:2px dashed #B9CCE6;border-radius:22px;padding:16px}
.boardwrap small{color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.guessbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.pot{font-family:var(--display);font-weight:800;font-size:18px;background:var(--lemon);border-radius:999px;padding:6px 14px}
.clues{display:flex;gap:8px;flex-wrap:wrap}
.clue-dot{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--card);color:var(--muted)}
.clue-dot.done{background:var(--ink);color:#fff;border-color:var(--ink)}.clue-dot.now{background:var(--lemon);color:var(--ink);border-color:var(--lemon)}
.art{background:var(--code);border:2px solid var(--line);border-radius:18px;padding:14px;display:grid;place-items:center;min-width:0}
.art svg{width:100%;height:auto;max-height:300px}
.boardwrap.mini{grid-auto-flow:column;grid-template-columns:auto 1fr auto;align-items:center;padding:10px 16px;gap:16px;border-style:solid}
.boardwrap.mini small.mt{max-width:70px;text-align:left;line-height:1.3}.boardwrap.mini .board{flex-wrap:nowrap;gap:clamp(3px,.6vw,8px)}
.boardwrap.mini .tile{flex:0 1 auto;min-width:0;width:clamp(26px,3.6vw,46px);height:clamp(36px,4.8vw,56px);font-size:clamp(18px,2.8vw,32px);border-radius:10px;box-shadow:0 4px 0 #061029}
.boardwrap.mini .guessbar{flex-wrap:nowrap;justify-content:flex-end}
.boardwrap.mini .tile.q{box-shadow:0 4px 0 #BFD0EA}
@media (max-width:860px){.boardwrap.mini{grid-auto-flow:row;grid-template-columns:1fr;justify-items:center}.boardwrap.mini small.mt{max-width:none;text-align:center}.boardwrap.mini .guessbar{flex-wrap:wrap;justify-content:center}}
.art svg{max-height:230px}

.open{background:#FFF8E1;border:2px solid #FFE08A;border-radius:18px;padding:16px 18px;font-size:18px;display:grid;gap:8px}
.open b{font-family:var(--display);font-size:20px}
.guessmodal{position:fixed;inset:0;background:rgba(11,27,63,.45);display:grid;place-items:center;z-index:5;padding-inline:16px}
.guessmodal .box{background:var(--card);border-radius:24px;padding:24px;max-width:560px;width:100%;display:grid;gap:14px;animation:pop .35s}
.guessmodal h2{margin:0;font-family:var(--display);font-size:28px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.final-q{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.final-q .open{font-size:17px}
@media (max-width:820px){.final-q{grid-template-columns:minmax(0,1fr)}}
</style>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap" id="app"></div>

<script>
(() => {
const TEAM_COLORS = ['#FF4D6D', '#1E7BFF', '#05C793'];
const WORD = 'DEBUGGING';
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* illustrations (inline SVG) */
const ART = {
  log: `<svg viewBox="0 0 420 260"><rect x="30" y="18" width="360" height="226" rx="10" fill="#FFFDF2" stroke="#D9CFA6" stroke-width="3"/>
    ${[60,92,124,156,188,220].map(y => `<line x1="54" y1="${y}" x2="366" y2="${y}" stroke="#E8DFB8" stroke-width="2"/>`).join('')}
    <text x="56" y="52" font-family="Courier New,monospace" font-size="15" fill="#5B4A1E">9/9  1545   Relay #70 Panel F</text>
    <rect x="150" y="96" width="120" height="86" fill="#FFE98A" opacity=".85" transform="rotate(-4 210 139)"/>
    <g transform="translate(210 140) rotate(-12)"><ellipse cx="0" cy="6" rx="7" ry="22" fill="#4A3F35"/><path d="M-4-10 L-46-34 L-40 8 Z" fill="#7A6B5A" opacity=".9"/><path d="M4-10 L46-34 L40 8 Z" fill="#7A6B5A" opacity=".9"/><path d="M-3-16 L-14-34 M3-16 L14-34" stroke="#4A3F35" stroke-width="2"/></g>
    <text x="56" y="214" font-family="Brush Script MT,Segoe Script,cursive" font-size="22" fill="#1E3A8A">“First actual case of ____ being found.”</text></svg>`,
  doctor: `<svg viewBox="0 0 420 220">${[['Symptom','“It hurts”','#FF4D6D'],['Tests','X-ray','#FFC93C'],['Diagnosis','The cause','#1E7BFF'],['Treatment','Fix it','#05C793']].map((s,i)=>`<g transform="translate(${18+i*102} 50)"><rect width="86" height="118" rx="16" fill="#fff" stroke="${s[2]}" stroke-width="4"/><circle cx="43" cy="38" r="20" fill="${s[2]}"/><text x="43" y="45" text-anchor="middle" font-family="Arial" font-weight="700" font-size="20" fill="#fff">${i+1}</text><text x="43" y="82" text-anchor="middle" font-family="Arial" font-weight="700" font-size="13" fill="#0B1B3F">${s[0]}</text><text x="43" y="102" text-anchor="middle" font-family="Arial" font-size="12" fill="#51607E">${s[1]}</text></g>${i<3?`<path d="M${108+i*102} 110 l10 0" stroke="#9AA9C2" stroke-width="4" stroke-linecap="round"/>`:''}`).join('')}
    <path d="M330 196 C 250 216 170 216 90 196" stroke="#9AA9C2" stroke-width="3" fill="none" stroke-dasharray="6 6"/><text x="210" y="214" text-anchor="middle" font-family="Arial" font-size="12" fill="#51607E">still sick? test again</text></svg>`,
  output: `<svg viewBox="0 0 420 230"><rect x="20" y="16" width="380" height="198" rx="16" fill="#F5F9FF" stroke="#D5E2F3" stroke-width="3"/><circle cx="44" cy="38" r="6" fill="#FF5F57"/><circle cx="62" cy="38" r="6" fill="#FEBC2E"/><circle cx="80" cy="38" r="6" fill="#28C840"/>
    <g font-family="Courier New,monospace" font-size="17" font-weight="700"><text x="44" y="84" fill="#0B1B3F">First number:  <tspan fill="#1E7BFF">5</tspan></text><text x="44" y="116" fill="#0B1B3F">Second number: <tspan fill="#1E7BFF">7</tspan></text>
    <rect x="36" y="134" width="210" height="36" rx="8" fill="#FFE3E9"/><text x="44" y="158" fill="#D11A43">Total: 57</text></g>
    <g transform="translate(330 150)"><circle r="34" fill="#FFC93C"/><text y="13" text-anchor="middle" font-family="Arial Black,Arial" font-size="40" fill="#0B1B3F">?</text></g>
    <text x="44" y="196" font-family="Arial" font-size="13" fill="#51607E">No red error message appeared.</text></svg>`,
  trace: `<svg viewBox="0 0 420 230"><rect x="14" y="14" width="392" height="200" rx="16" fill="#F5F9FF" stroke="#D5E2F3" stroke-width="3"/>
    <g font-family="Courier New,monospace" font-size="13.5" font-weight="700"><text x="34" y="50" fill="#D11A43">Traceback (most recent call last):</text><text x="34" y="76" fill="#334155">  File "main.py", <tspan fill="#1E7BFF">line 6</tspan>, in &lt;module&gt;</text><text x="34" y="100" fill="#334155">    product = multiply(num1, num2)</text><text x="34" y="124" fill="#334155">  File "main.py", <tspan fill="#1E7BFF">line 2</tspan>, in multiply</text><text x="34" y="148" fill="#334155">    return a * b</text>
    <rect x="28" y="160" width="370" height="30" rx="6" fill="#FFE3E9"/><text x="34" y="180" fill="#D11A43">TypeError: can't multiply sequence by ...</text></g>

  haystack: `<svg viewBox="0 0 420 230">${Array.from({length:10},(_,i)=>`<rect x="40" y="${18+i*20}" width="${200+((i*53)%120)}" height="10" rx="5" fill="${i===6?'#FF4D6D':'#D5E2F3'}"/>`).join('')}
    <text x="40" y="226" font-family="Arial" font-size="13" fill="#51607E">line 1 … line 1,000</text>
    <g transform="translate(330 120)"><circle r="44" fill="#E3F0FF" stroke="#1E7BFF" stroke-width="5"/><text y="12" text-anchor="middle" font-family="Arial Black,Arial" font-size="34" fill="#1E7BFF">?</text></g></svg>`,
};

const CLUES = [
  { title: 'The 1947 log book', bloom: 'Analyse / Infer', time: 45, art: 'log', reveal: [2, 3, 4],
    q: 'Engineers stuck something into this computer log book in 1947. What do you think they found inside the machine?',
    opts: ['A computer virus', 'A real insect (a moth)', 'A broken wire', 'A hacker’s note'], ans: 1,
    think: 'Why would a small thing stuck inside a machine stop it from working? What might the missing word be?',
    why: 'They found a real moth trapped in a relay of the Harvard Mark II. Since then, a mistake that stops a program working is called a <b>bug</b>. Look at the board: B U G!' },
  { title: 'The doctor', bloom: 'Analyse / Compare', time: 40, art: 'doctor', reveal: [0],
    q: 'A doctor follows these four steps. Which job in programming follows the same pattern?',
    opts: ['Writing a brand-new program', 'Finding the cause of a problem in code and fixing it', 'Deleting the app and starting again', 'Buying a faster computer'], ans: 1,
    think: 'Match each doctor step to something a programmer does. What is the “symptom” of a broken program?',
    why: 'Programmers also see a symptom (wrong output), test, find the cause, fix it and test again. That cycle is what we study today.' },
  { title: 'The silent problem', bloom: 'Evaluate', time: 40, art: 'output', reveal: [7],
    q: 'The program printed no error message. Is it working correctly?',
    opts: ['Yes, no error message means it works', 'No, it runs but gives the wrong answer', 'Yes, 57 is the correct total', 'We cannot tell anything from this'], ans: 1,
    think: 'What answer did we expect? Why might a computer join 5 and 7 instead of adding them?',
    why: '5 + 7 should be 12. The program runs but the answer is wrong, so there is a hidden problem. Some bugs never show an error message.' },
  { title: 'The clue message', bloom: 'Analyse', time: 40, art: 'trace', reveal: [6],
    q: 'Python showed this red message. What is it really giving the programmer?',
    opts: ['Decoration to make the screen look busy', 'A warning that the computer has a virus', 'Clues: the line number and the type of problem', 'A message that the program finished successfully'], ans: 2,
    think: 'Which parts of the message would help you most to find the problem quickly? Why?',
    why: 'Error messages are clues. They tell you the line (line 2, line 6) and the type of problem (TypeError), like evidence for a detective.' },
  { title: 'The needle in the haystack', bloom: 'Create', time: 60, art: 'haystack', reveal: [1], open: true,
    q: 'Your program has 1,000 lines and gives one wrong answer. Design a plan to find the guilty line without reading all 1,000 lines.',
    think: 'Talk in your team for one minute. Be ready to share two steps of your plan and explain why they save time.',
    why: 'Great plans include: print values at checkpoints, test a smaller part of the program, start from the error and work backwards, and group similar problems. These are today’s <b>debugging strategies</b>!' },
];
const POTS = [50, 40, 30, 20, 10, 5];

let S = { screen: 'start', teams: ['Team Byte', 'Team Pixel', 'Team Logic'], scores: [0, 0, 0], r: 0, picked: null, revealed: false, shown: [], solvedBy: null, modal: false };
let timerId = null, tLeft = 0, muted = false, actx = null;
const hl = s => s.replace(/<(k|s|f|d|c)>/g, '<span class="$1">').replace(/<\/(k|s|f|d|c)>/g, '</span>');

const IC = {
  bug: '<svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="28" rx="12" ry="14" fill="#FF4D6D"/><circle cx="24" cy="13" r="7" fill="#0B1B3F"/><path d="M24 15v27" stroke="#0B1B3F" stroke-width="2.5"/><circle cx="19" cy="25" r="2.6" fill="#0B1B3F"/><circle cx="29" cy="32" r="2.6" fill="#0B1B3F"/><path d="M12 24l-7-3M12 31H4M13 37l-7 4M36 24l7-3M36 31h8M35 37l7 4M21 8l-3-5M27 8l3-5" stroke="#0B1B3F" stroke-width="2.5" stroke-linecap="round"/></svg>',
  sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 010 6M19 6a8 8 0 010 12"/></svg>',
  mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
  brain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4a3 3 0 00-3 3 3 3 0 00-2 5 3 3 0 002 5 3 3 0 003 3V4zM15 4a3 3 0 013 3 3 3 0 012 5 3 3 0 01-2 5 3 3 0 01-3 3V4z"/></svg>',
  ok: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#05C793"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  play: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>',
};

/* ---------- sound ---------- */
function beep(freqs, dur = 0.12, type = 'sine', gap = 0.09) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    });
  } catch (e) {}
}
const sfx = { pick: () => beep([660], .08), right: () => beep([523, 659, 784, 1046], .16), wrong: () => beep([220, 180], .2, 'square', .12), tick: () => beep([880], .04, 'triangle'), point: () => beep([988, 1318], .1) };

/* ---------- background canvas: drifting bugs + confetti ---------- */
const cv = document.getElementById('fx'), cx = cv.getContext('2d');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, bugs = [], conf = [];
function size() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', size); size();
const palette = ['#FF4D6D', '#1E7BFF', '#05C793', '#FFC93C', '#7A5CFF'];
for (let i = 0; i < 14; i++) bugs.push({ x: Math.random() * W, y: Math.random() * H, a: Math.random() * 6.28, s: (14 + Math.random() * 16) * devicePixelRatio, v: (.15 + Math.random() * .35) * devicePixelRatio, c: palette[i % 5], w: Math.random() * 6 });
function drawBug(b, t) {
  cx.save(); cx.translate(b.x, b.y); cx.rotate(b.a + Math.PI / 2); cx.globalAlpha = .16; cx.fillStyle = b.c; cx.strokeStyle = b.c; cx.lineWidth = b.s * .09; cx.lineCap = 'round';
  const wig = Math.sin(t / 180 + b.w) * .25;
  for (const sd of [-1, 1]) for (let k = -1; k <= 1; k++) { cx.beginPath(); cx.moveTo(0, k * b.s * .25); cx.lineTo(sd * b.s * .55, k * b.s * .35 + sd * wig * b.s * .2); cx.stroke(); }
  cx.beginPath(); cx.ellipse(0, b.s * .1, b.s * .33, b.s * .42, 0, 0, 6.28); cx.fill();
  cx.beginPath(); cx.arc(0, -b.s * .42, b.s * .2, 0, 6.28); cx.fill(); cx.restore();
}
function frame(t) {
  cx.clearRect(0, 0, W, H);
  for (const b of bugs) {
    if (!reduce) { b.a += (Math.sin(t / 2000 + b.w) * .01); b.x += Math.cos(b.a) * b.v; b.y += Math.sin(b.a) * b.v; }
    if (b.x < -60) b.x = W + 50; if (b.x > W + 60) b.x = -50; if (b.y < -60) b.y = H + 50; if (b.y > H + 60) b.y = -50;
    drawBug(b, t);
  }
  conf = conf.filter(p => p.life > 0);
  for (const p of conf) { p.vy += .12 * devicePixelRatio; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.min(1, p.life / 40); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function burst(n = 140) {
  if (reduce) return;
  for (let i = 0; i < n; i++) conf.push({ x: W / 2 + (Math.random() - .5) * W * .4, y: H * .35, vx: (Math.random() - .5) * 14 * devicePixelRatio, vy: (-6 - Math.random() * 9) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .3, w: (6 + Math.random() * 8) * devicePixelRatio, h: (4 + Math.random() * 5) * devicePixelRatio, c: palette[i % 5], life: 110 + Math.random() * 60 });
}

/* ---------- timer ---------- */
function stopTimer() { clearInterval(timerId); timerId = null; }
function startTimer(sec) {
  stopTimer(); tLeft = sec; paintRing(sec);
  timerId = setInterval(() => { tLeft--; paintRing(sec); if (tLeft <= 5 && tLeft > 0) sfx.tick(); if (tLeft <= 0) { stopTimer(); reveal(); } }, 1000);
}
function paintRing(total) {
  const r = document.querySelector('.ring'); if (!r) return;
  const C = 2 * Math.PI * 24, f = Math.max(0, tLeft) / total;
  r.querySelector('.arc').setAttribute('stroke-dashoffset', C * (1 - f));
  r.querySelector('b').textContent = Math.max(0, tLeft);
  r.classList.toggle('low', tLeft <= 10);
  r.querySelector('.arc').setAttribute('stroke', tLeft <= 10 ? '#FF4D6D' : '#1E7BFF');
}


/* ---------- views ---------- */
function topBar() {
  return `<div class="top"><div class="brand">${IC.bug}<span>Mystery Topic Detectives</span></div>
    <div class="scores">${S.teams.map((t, i) => `<div class="team t${i}" id="team${i}"><span class="nm">${esc(t)}</span><span class="pt">${S.scores[i]}</span></div>`).join('')}
    <button class="iconbtn" id="mute" aria-label="${muted ? 'Turn sound on' : 'Turn sound off'}">${muted ? IC.mute : IC.sound}</button></div></div>`;
}
const colorOf = i => { for (let c = 0; c < CLUES.length; c++) if (CLUES[c].reveal.includes(i)) return 'c' + c; return 'c1'; };
function board(fresh = []) {
  return `<div class="board" aria-label="Mystery topic">${[...WORD].map((ch, i) => S.shown.includes(i) ? `<div class="tile ${colorOf(i)} ${fresh.includes(i) ? 'new' : ''}">${ch}</div>` : `<div class="tile q">?</div>`).join('')}</div>`;
}
function pot() { return POTS[Math.min(S.screen === 'start' ? 0 : S.r + (S.revealed ? 1 : 0), POTS.length - 1)]; }
function startView() {
  return topBar() + `<section class="stage"><div class="hero">
      <div><span class="tag bloom">Warm-up · before Session 1 · Grade 11</span>
        <h1>Today’s topic is a <em>mystery</em>.</h1>
        <p>Five clues. Each one hides a piece of today’s lesson. Analyse every clue, explain your thinking, and be the first team to name the mystery topic. The earlier you guess, the more points you win.</p></div>
      <div class="case"><h3>Name your detective teams</h3>
        ${S.teams.map((t, i) => `<div><label for="tn${i}">Team ${i + 1}</label><input id="tn${i}" maxlength="18" value="${esc(t)}" style="border-color:${TEAM_COLORS[i]}55"></div>`).join('')}</div>
    </div>
    <div class="boardwrap"><small>The mystery topic · ${WORD.length} letters</small>${board()}</div>
    <div class="rules">
      <div class="rule"><b>+10 per clue</b><small>Correct answer to a clue question, with a reason.</small></div>
      <div class="rule"><b>Guess the topic anytime</b><small>Worth 50 points before any clue, then fewer after each clue.</small></div>
      <div class="rule"><b>Explain why</b><small>Every answer needs evidence from the clue.</small></div>
    </div></section>
    <div class="ctrl"><span class="hint"><kbd>Space</kbd> reveals the answer, <kbd>→</kbd> next clue</span><button class="btn main" id="go">${IC.play} Open clue 1</button></div>`;
}
function clueView(fresh = []) {
  const R = CLUES[S.r], C = (2 * Math.PI * 24).toFixed(2);
  const opts = R.open ? `<div class="open"><b>Team challenge</b><span>${R.think}</span></div>` : `<div class="opts">${R.opts.map((o, i) => {
      let cls = 'opt'; if (S.picked === i) cls += ' pick'; if (S.revealed) cls += i === R.ans ? ' right' : ' wrong';
      return `<button class="${cls}" data-opt="${i}"><span class="L">${'ABCD'[i]}</span><span class="tx">${o}</span></button>`; }).join('')}</div>`;
  const awards = S.revealed ? `<div class="award"><span>Award +10</span>${S.teams.map((t, i) => `<button class="give t${i}" data-give="${i}" data-pts="10">+10 ${esc(t)}</button>`).join('')}</div>` : '';
  return topBar() + `<section class="stage" aria-live="polite">
    <div class="meta"><div class="clues">${CLUES.map((_, i) => `<span class="clue-dot ${i < S.r ? 'done' : i === S.r ? 'now' : ''}">${i + 1}</span>`).join('')}</div>
      <span class="tag kind">${R.title}</span><span class="tag bloom">${R.bloom}</span>
      <div class="timer"><div class="ring"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" stroke="#D5E2F3" stroke-width="6" fill="none"/><circle class="arc" cx="28" cy="28" r="24" stroke="#1E7BFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><b>${S.revealed ? '✓' : R.time}</b></div></div></div>
    <div class="boardwrap mini"><small class="mt">Mystery topic</small>${board(fresh)}
      <div class="guessbar"><span class="pot">Guess now: ${pot()} pts</span><button class="btn alt" id="guess">We know the topic!</button></div></div>
    <h1 class="q">${R.q}</h1>
    <div class="body"><div class="art">${ART[R.art]}</div>${opts}</div>
    ${S.revealed ? `<div class="reveal">${IC.ok}<p>${R.why}</p></div>` : (R.open ? '' : `<div class="think">${IC.brain}<div><b>Think deeper:</b> ${R.think}</div></div>`)}
    ${awards}
  </section>
    <div class="ctrl"><button class="btn ghost" id="back" ${S.r === 0 ? 'disabled' : ''}>Back</button>
      ${S.revealed ? `<button class="btn main" id="next">${S.r === CLUES.length - 1 ? 'Reveal the topic' : 'Next clue'} →</button>` : `<button class="btn main" id="rev">Reveal the answer</button>`}</div>
    ${S.modal ? guessModal() : ''}`;
}
function guessModal() {
  return `<div class="guessmodal" role="dialog" aria-modal="true" aria-label="Team guess"><div class="box">
    <h2>Which team is guessing?</h2><p style="margin:0;color:var(--muted)">Ask the team to say the topic out loud and give one piece of evidence from the clues.</p>
    <div class="row">${S.teams.map((t, i) => `<button class="give t${i}" data-right="${i}">${esc(t)} is right (+${pot()})</button>`).join('')}</div>
    <div class="row"><button class="btn ghost" id="wrongguess">Not quite, keep going</button></div></div></div>`;
}
function endView() {
  const order = [0, 1, 2].sort((a, b) => S.scores[b] - S.scores[a]);
  const place = [order[1], order[0], order[2]], ph = [140, 190, 100], lbl = ['2', '1', '3'];
  return topBar() + `<section class="stage"><span class="tag bloom">Mystery solved</span>
    <div class="boardwrap" style="background:#fff;border-style:solid">${board([...WORD].map((_, i) => i))}</div>
    <h1 class="q" style="text-align:center">Today we become programmers who hunt and fix bugs.</h1>
    <div class="final-q">
      <div class="open"><b>Connect the clues</b><span>What do the moth, the doctor, the wrong total and the red error message have in common?</span></div>
      <div class="open"><b>Predict</b><span>Name one strategy you think programmers use to find a bug. We will check your prediction by the end of the lesson.</span></div>
    </div>
    <div class="podium">${place.map((t, i) => `<div class="pod"><div class="who">${esc(S.teams[t])}</div><div class="sc">${S.scores[t]} pts</div><div class="blk" style="height:${ph[i]}px;background:${TEAM_COLORS[t]};animation-delay:${i * .15}s">${lbl[i]}</div></div>`).join('')}</div></section>
    <div class="ctrl"><button class="btn ghost" id="again">Play again</button><span class="hint">Next: Sprint 1.5 · Debugging Strategies</span></div>`;
}
function render(fresh = []) {
  app.innerHTML = S.screen === 'start' ? startView() : S.screen === 'clue' ? clueView(fresh) : endView();
  bind();
}
/* ---------- actions ---------- */
function bump(i) { const el = document.getElementById('team' + i); if (!el) return; el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 260); }
function reveal() {
  if (S.revealed) return; stopTimer(); S.revealed = true;
  const R = CLUES[S.r], fresh = R.reveal.filter(i => !S.shown.includes(i));
  S.shown = [...new Set([...S.shown, ...R.reveal])];
  render(fresh); sfx.right(); burst(90);
}
function goClue(i) { S.screen = 'clue'; S.r = i; S.picked = null; S.revealed = false; S.modal = false; render(); startTimer(CLUES[i].time); }
function finish() { stopTimer(); const fresh = [...WORD].map((_, i) => i).filter(i => !S.shown.includes(i)); S.shown = [...WORD].map((_, i) => i); S.screen = 'end'; render(fresh); burst(240); sfx.right(); }
function keepRing() { if (S.screen === 'clue' && !S.revealed && timerId) paintRing(CLUES[S.r].time); }
function bind() {
  const $ = id => document.getElementById(id);
  $('mute') && ($('mute').onclick = () => { muted = !muted; render(); keepRing(); });
  if (S.screen === 'start') {
    S.teams.forEach((_, i) => { const inp = $('tn' + i); inp.oninput = () => { S.teams[i] = inp.value.trim() || `Team ${i + 1}`; document.querySelector(`#team${i} .nm`).textContent = S.teams[i]; }; });
    $('go').onclick = () => { S.scores = [0, 0, 0]; S.shown = []; sfx.point(); goClue(0); };
  }
  if (S.screen === 'clue') {
    document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { if (S.revealed) return; S.picked = +b.dataset.opt; sfx.pick(); render(); keepRing(); });
    $('rev') && ($('rev').onclick = reveal);
    $('next') && ($('next').onclick = () => S.r < CLUES.length - 1 ? goClue(S.r + 1) : finish());
    $('back') && ($('back').onclick = () => S.r > 0 && goClue(S.r - 1));
    $('guess') && ($('guess').onclick = () => { S.modal = true; render(); keepRing(); });
    $('wrongguess') && ($('wrongguess').onclick = () => { S.modal = false; sfx.wrong(); render(); keepRing(); });
    document.querySelectorAll('[data-right]').forEach(b => b.onclick = () => { const i = +b.dataset.right; S.scores[i] += pot(); S.modal = false; sfx.point(); finish(); });
    document.querySelectorAll('[data-give]').forEach(b => b.onclick = () => { const i = +b.dataset.give; S.scores[i] += +b.dataset.pts; sfx.point(); document.querySelector(`#team${i} .pt`).textContent = S.scores[i]; bump(i); });
    keepRing();
  }
  if (S.screen === 'end') $('again').onclick = () => { S.screen = 'start'; S.shown = []; render(); };
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || S.screen !== 'clue' || S.modal) return;
  if (e.code === 'Space') { e.preventDefault(); if (!S.revealed) reveal(); }
  if (e.key === 'ArrowRight' && S.revealed) document.getElementById('next')?.click();
});
window.claude?.hot?.snapshot?.(() => ({ S }));
const boot = data => { if (data && data.S) S = Object.assign(S, data.S); render(); if (S.screen === 'clue' && !S.revealed) startTimer(CLUES[S.r].time); };
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
